services:
  - type: web
    name: medai-backend
    runtime: python
    rootDir: medical-ai-backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_TEXT
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_VISION
        value: gemini-3.8-flash
      - key: GEMINI_TIMEOUT
        value: "90"
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_BUCKET
        value: medical-images
